name: flowforge

services:
  postgres:
    image: postgres:17-alpine
    container_name: flowforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.2
    container_name: flowforge-migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/flowforge?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  seed:
    image: postgres:17-alpine
    container_name: flowforge-seed
    volumes:
      - ./migrations/seed.sql:/seed.sql:ro
    environment:
      PGPASSWORD: postgres
    command:
      - psql
      - -h
      - postgres
      - -U
      - postgres
      - -d
      - flowforge
      - -f
      - /seed.sql
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: flowforge-api
    ports:
      - "8080:8080"
    environment:
      ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowforge?sslmode=disable
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
      ALLOWED_HTTP_HOSTS: httpbin.org,localhost,127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: flowforge-worker
    environment:
      ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowforge?sslmode=disable
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
      ALLOWED_HTTP_HOSTS: httpbin.org,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
